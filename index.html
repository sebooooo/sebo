<style>
:root{--bg:#0b0b0b;--panel:#161616;--line:#2a2a2a;--text:#f2f2f2;--mute:#8d8d8d;--gray:#c9c9c9;--hi:#fff;--rule:#3a3a3a;--yt-red:#ff0000}
[data-theme=light]{--hi:#000;--rule:#bdbdbd;--bg:#ececec;--panel:#fafafa;--line:#d6d6d6;--text:#111;--mute:#6b6b6b;--gray:#222}
*{box-sizing:border-box;margin:0}
body{transition:background-color .5s,color .5s;background:var(--bg);color:var(--text);font:16px/1.6 Archivo,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gray);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.logo img{height:24px;width:auto;display:block}
[data-theme=light] .logo img{filter:invert(1)}
header{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:5;width:calc(100% - 32px);transition:background-color .5s,border-color .5s;max-width:600px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 6px 6px 16px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
nav{display:flex;gap:24px;font-size:14px;font-weight:400}
nav a{color:var(--mute);transition:color .8s ease}
nav a:hover{color:var(--hi)}
.act{display:flex;align-items:center;gap:8px;justify-self:end}
#theme{position:relative;background:none;border:0;color:var(--mute);cursor:pointer;width:32px;height:32px;border-radius:50%;transition:color .6s ease}
#theme:hover{color:var(--hi)}
#theme svg{position:absolute;top:50%;left:50%;margin:-9px 0 0 -9px;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .5s}
#theme .sun{transform:rotate(-180deg) scale(.2);opacity:0}
[data-theme=light] #theme .moon{transform:rotate(180deg) scale(.2);opacity:0}
[data-theme=light] #theme .sun{transform:none;opacity:1}
#theme.spin{animation:spin 1s cubic-bezier(.6,0,.2,1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.talk{background:var(--gray);color:var(--bg);font-weight:500;font-size:14px;padding:8px 18px;border-radius:999px;transition:background-color .6s ease,color .5s}
.talk:hover{background:var(--hi)}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:90px 24px 60px}
.hero h1{font-size:clamp(72px,17vw,220px);line-height:.9;font-weight:900;font-style:italic;letter-spacing:-.05em;color:var(--text);padding-right:.1em}
.hero p{color:var(--mute);font-size:20px;margin-top:20px}
section{padding:72px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.sub{color:var(--mute);margin-bottom:32px;max-width:56ch}
#clients h2{margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
#work .wrap{max-width:984px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:32px 48px;flex-wrap:wrap}
.num{display:grid}
.num b{grid-area:1/1;font-weight:900;font-size:clamp(44px,7.5vw,100px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--gray)}
.num .sizer{visibility:hidden}
.lbl{display:flex;justify-content:space-between;margin-top:10px;color:var(--mute);font-size:13px;text-transform:uppercase}
.lbl i{font-style:normal}
.tools{margin-top:56px;padding:44px 0 28px;border-top:1px solid var(--rule)}
.tools .row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.tool{position:relative;width:56px;height:56px;display:block;transition:transform .45s ease,filter .45s ease}
.tool:hover{transform:translateY(-4px);filter:brightness(1.2)}
.tool img{width:100%;height:100%;display:block;object-fit:contain}
.tool em{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap;opacity:0;transition:opacity .45s ease}
.tool:hover em{opacity:1}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;padding:0;display:block;width:100%;color:inherit}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::before,.thumb::after{content:"";position:absolute;left:0;right:0;height:38%;opacity:0;transition:opacity .5s ease;pointer-events:none}
.thumb::before{top:0;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.thumb::after{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.thumb .views{position:absolute;top:12px;right:12px;z-index:1;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;opacity:0;transition:opacity .5s ease}
.thumb .views[hidden]{display:none}
.thumb .views svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.thumb .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;text-align:left;color:#fff;font-size:16px;font-weight:500;opacity:0;transition:opacity .5s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb:hover::before,.thumb:hover::after,.thumb:hover .views,.thumb:hover .cap,.thumb:focus-visible::before,.thumb:focus-visible::after,.thumb:focus-visible .views,.thumb:focus-visible .cap{opacity:1}
@media(hover:none){.thumb::before,.thumb::after,.thumb .views,.thumb .cap{opacity:1}}
.clients{display:flex;flex-wrap:wrap;gap:44px 48px}
.client{display:flex;flex-direction:column;align-items:center;gap:10px;width:120px;text-align:center;color:var(--mute);transition:color .6s ease}
.client strong{font-weight:500;font-size:15px}
.client small{color:var(--mute);opacity:.7;font-size:12px;margin-top:-6px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:30px;color:var(--gray);transition:filter .7s ease,border-color .7s ease,box-shadow .7s ease}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.client:hover{color:var(--hi)}
.client:hover .avatar{filter:brightness(1.2);border-color:#3b82f6}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.socials{display:flex;gap:18px}
.socials a{width:30px;height:30px;display:grid;place-items:center;color:var(--mute);transition:color .6s ease}
.socials a:hover{color:var(--hi)}
.socials svg{width:22px;height:22px;fill:currentColor}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:grid;place-items:center;z-index:10;padding:24px;visibility:hidden;opacity:0;transition:opacity .4s ease,visibility .4s}
#lb.open{visibility:visible;opacity:1}
#lb img{max-width:calc(100vw - 170px);max-height:calc(100vh - 150px);border-radius:6px;transform:scale(.93);transition:transform .5s ease}
#lb.open img{transform:none}
.lb-bar{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;pointer-events:none}
.lb-bar span{font-size:18px;font-weight:500}
/* Changed view button to RED instead of blue */
.yt{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:var(--yt-red);color:#fff;font-weight:600;font-size:14px;padding:10px 20px;border-radius:999px;transition:background-color .3s ease,transform .2s ease}
.yt:hover{background:#cc0000;transform:scale(1.03)}
.yt[hidden]{display:none}
.yt svg{width:18px;height:18px;fill:currentColor}
#lb button{position:absolute;background:none;border:0;color:#fff;cursor:pointer}
#lb .lb-x{top:16px;right:20px;font-size:36px}
#lb .lb-nav{top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);font-size:34px;line-height:1;transition:background-color .5s ease}
#lb .lb-nav:hover{background:rgba(255,255,255,.25)}
#lb .prev{left:20px}#lb .next{right:20px}
@media(max-width:640px){nav{display:none}header{grid-template-columns:1fr auto}.hero{padding:80px 24px 40px}.grid{grid-template-columns:1fr}}
</style>
</head>

function startCount() {
  const el = document.getElementById("statNum");
  document.getElementById("statSizer").textContent = SITE.totalViews;
  document.getElementById("statLbl").innerHTML = [..."Total views"].map(c => `<i>${c === " " ? "&nbsp;" : c}</i>`).join("");
  const m = /^([\d.]+)\s*([KkMm]?)/.exec(SITE.totalViews);
  const end = m ? parseFloat(m[1]) * ({ K: 1e3, M: 1e6 }[m[2].toUpperCase()] || 1) : 0, start = 1e6, dur = 1800;
  if (end <= start) { el.textContent = SITE.totalViews; return; }
  const f = v => (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M+";
  const tick = () => {
    const p = Math.min(performance.now() / dur, 1), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    el.textContent = p < 1 ? f(start + (end - start) * e) : SITE.totalViews;
    if (p < 1) requestAnimationFrame(tick);
  };
  tick();
}

let activeIdx = 0;

function init() {
  document.getElementById("headline").textContent = SITE.name;
  document.getElementById("tagline").textContent = SITE.tagline;
  document.getElementById("talk").href = SITE.talkUrl;

  startCount();

  // Render Work Grid
  const grid = document.getElementById("grid");
  grid.innerHTML = SITE.thumbnails.map((t, i) => `
    <button class="thumb" onclick="openLb(${i})">
      <img src="${t.img}" alt="${t.title || 'Thumbnail'}">
      ${t.views ? `<div class="views"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span>${t.views}</span></div>` : ''}
      <div class="cap">${t.title || ''}</div>
    </button>
  `).join('');

  // Render Clients
  const clientList = document.getElementById("clientList");
  clientList.innerHTML = SITE.clients.map(c => `
    <a class="client" href="${c.link || '#'}" target="_blank" rel="noopener">
      <div class="avatar">${c.avatar ? `<img src="${c.avatar}">` : c.name[0]}</div>
      <strong>${c.name}</strong>
      <small>${c.subs}</small>
    </a>
  `).join('');

  // Render Tools
  const tools = document.getElementById("tools");
  tools.innerHTML = SITE.tools.map(t => `
    <a class="tool" href="${t.url}" target="_blank" rel="noopener" title="${t.name}">
      <div style="width:100%;height:100%;display:grid;place-items:center;background:var(--panel);border-radius:12px;border:1px solid var(--line);font-weight:bold;font-size:12px;">${t.name}</div>
      <em>${t.name}</em>
    </a>
  `).join('');

  // Render Socials
  const socials = document.getElementById("socials");
  socials.innerHTML = SITE.socials.map(s => `
    <a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label}">${ICONS[s.icon] || ''}</a>
  `).join('');

  // Lightbox navigation
  document.querySelector("#lb .lb-x").onclick = closeLb;
  document.querySelector("#lb .prev").onclick = () => navLb(-1);
  document.querySelector("#lb .next").onclick = () => navLb(1);
  document.getElementById("lb").onclick = (e) => { if (e.target.id === "lb") closeLb(); };

  // Theme Toggle
  document.getElementById("theme").onclick = () => {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    document.documentElement.setAttribute("data-theme", isLight ? "dark" : "light");
  };
}

function openLb(i) {
  activeIdx = i;
  const item = SITE.thumbnails[i];
  const lb = document.getElementById("lb");
  lb.querySelector("img").src = item.img;
  document.getElementById("lbTitle").textContent = item.title || '';
  const ytBtn = document.getElementById("lbYt");
  if (item.url) {
    ytBtn.href = item.url;
    ytBtn.innerHTML = `View on YouTube ↗`;
    ytBtn.removeAttribute("hidden");
  } else {
    ytBtn.setAttribute("hidden", "");
  }
  lb.classList.add("open");
}

function closeLb() {
  document.getElementById("lb").classList.remove("open");
}

function navLb(dir) {
  activeIdx = (activeIdx + dir + SITE.thumbnails.length) % SITE.thumbnails.length;
  openLb(activeIdx);
}

document.addEventListener("DOMContentLoaded", init);
</script>
