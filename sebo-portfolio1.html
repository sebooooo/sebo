<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sebo | Portfolio</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 60px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    #clients {
      margin-top: 40px;
    }

    #clients h2 {
      margin-bottom: 32px;
      text-align: center;
      font-size: 1.8rem;
    }

    .clients {
      display: flex;
      flex-wrap: wrap;
      gap: 44px 48px;
      justify-content: center;
    }

    .client {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease;
    }

    .client:hover {
      transform: translateY(-4px);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid transparent;
      object-fit: cover;
      margin-bottom: 12px;
      transition: filter 0.2s ease, border-color 0.2s ease;
    }

    .client:hover .avatar {
      filter: brightness(1.2);
      border-color: #60a5fa;
    }

    .client-name {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 2px;
    }

    .client-subs {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Sebo</h1>
      <p>Video Editor & Content Creator</p>
    </header>

    <section id="clients">
      <h2>Worked with</h2>
      <div class="clients" id="clients-container">
        <!-- Dynamic content rendered via JS -->
      </div>
    </section>
  </div>

  <script>
    const clients = [
      { name: "Neo's Mind", handle: "@NeosMindMc", subs: "157K subscribers", avatar: "https://unavatar.io/youtube/NeosMindMc", link: "https://www.youtube.com/@NeosMindMc" },
      { name: "SirYakari",  handle: "@SirYakari",  subs: "1.04M subscribers", avatar: "https://unavatar.io/youtube/SirYakari", link: "https://www.youtube.com/@SirYakari" },
      { name: "Hestreng",   handle: "@Hestreng",   subs: "108K subscribers",  avatar: "https://unavatar.io/youtube/Hestreng", link: "https://www.youtube.com/@Hestreng" }
    ];

    const container = document.getElementById('clients-container');

    clients.forEach(client => {
      const clientEl = document.createElement('a');
      clientEl.className = 'client';
      clientEl.href = client.link;
      clientEl.target = '_blank';
      clientEl.rel = 'noopener noreferrer';

      clientEl.innerHTML = `
        <img class="avatar" src="${client.avatar}" alt="${client.name}">
        <div class="client-name">${client.name}</div>
        <div class="client-subs">${client.subs}</div>
      `;

      container.appendChild(clientEl);
    });
  </script>

</body>
</html>
