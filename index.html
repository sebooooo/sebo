<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebo · Minecraft Thumbnail Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,800;0,900;1,900&display=swap" rel="stylesheet">
<script>(()=>{try{const t=localStorage.getItem("sebo-theme");if(t==="light")document.documentElement.dataset.theme="light";}catch(e){}document.documentElement.classList.add("page-loading");})();</script>
<style>
:root{--bg:#0b0b0b;--panel:#161616;--line:#2a2a2a;--text:#f2f2f2;--mute:#8d8d8d;--gray:#c9c9c9;--hi:#fff;--rule:#3a3a3a}
[data-theme=light]{--hi:#000;--rule:#bdbdbd;--bg:#ececec;--panel:#fafafa;--line:#d6d6d6;--text:#111;--mute:#6b6b6b;--gray:#222}
*{box-sizing:border-box;margin:0}
body{transition:background-color .5s,color .5s;background:var(--bg);color:var(--text);font:16px/1.6 Archivo,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gray);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.logo img{height:24px;width:auto;display:block}
[data-theme=light] .logo img{filter:invert(1)}
header{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:5;width:calc(100% - 32px);transition:background-color .5s,border-color .5s;max-width:660px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 8px 8px 18px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
nav{display:flex;gap:28px;font-size:16px;font-weight:400}
nav a{color:var(--mute);transition:color .8s ease}
nav a:hover{color:var(--hi)}
.act{display:flex;align-items:center;gap:8px;justify-self:end}
#theme{position:relative;background:none;border:0;color:var(--mute);cursor:pointer;width:34px;height:34px;border-radius:50%;transition:color .6s ease}
#theme:hover{color:var(--hi)}
#theme svg{position:absolute;top:50%;left:50%;margin:-9px 0 0 -9px;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .5s}
#theme .sun{transform:rotate(-180deg) scale(.2);opacity:0}
[data-theme=light] #theme .moon{transform:rotate(180deg) scale(.2);opacity:0}
[data-theme=light] #theme .sun{transform:none;opacity:1}
#theme.spin{animation:spin 1s cubic-bezier(.6,0,.2,1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.talk{background:var(--gray);color:var(--bg);font-weight:500;font-size:14px;padding:9px 20px;border-radius:999px;transition:background-color .6s ease,color .5s}
.talk:hover{background:var(--hi)}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:170px 24px 125px}
.hero h1{font-size:clamp(72px,17vw,220px);line-height:.9;font-weight:900;font-style:italic;letter-spacing:-.05em;color:var(--text);padding-right:.1em;min-height:.9em}
.hero p{color:var(--mute);font-size:20px;margin-top:30px}
section{padding:72px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.sub{color:var(--mute);margin-bottom:32px;max-width:56ch}
#clients h2{margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
#work .wrap{max-width:1360px}
.hero-top{display:flex;align-items:center;justify-content:center;gap:clamp(180px,14vw,260px)}
.stat{width:clamp(240px,26vw,350px);flex:0 0 clamp(240px,26vw,350px);text-align:center}
.num{position:relative;width:100%;height:clamp(44px,7.5vw,100px);display:block;min-width:0}
.num b{position:absolute;inset:0;width:100%;display:block;font-weight:900;font-size:clamp(44px,7.5vw,100px);line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--gray);text-align:center;white-space:nowrap}
.num .sizer{visibility:hidden}
.lbl{display:block;width:100%;margin-top:12px;color:var(--mute);font-size:12px;line-height:1.1;letter-spacing:.18em;text-transform:uppercase;text-align:center}
.lbl i{font-style:normal}
.tools{margin-top:104px;padding:72px 0 36px;border-top:1px solid var(--rule)}
.tools .row{display:flex;flex-wrap:wrap;gap:30px;justify-content:center}
.tool{position:relative;width:68px;height:68px;display:block;transition:transform .45s ease,filter .45s ease}
.tool:hover{transform:translateY(-4px);filter:brightness(1.2)}
.tool:not(:last-child)::after{content:"";position:absolute;right:-16px;top:22px;width:1px;height:24px;background:var(--line);opacity:.72}
.tool img{width:100%;height:100%;display:block;object-fit:contain}
.tool em{position:absolute;top:100%;left:50%;transform:translate(-50%,4px);margin-top:10px;font-style:normal;font-size:13px;color:var(--mute);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease,color .35s ease}
.tool:hover em{opacity:1;transform:translate(-50%,0);color:var(--hi)}
.thumb{contain:paint;position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;padding:0;display:block;width:100%;color:inherit;transition:transform .3s cubic-bezier(.22,1,.36,1),border-color .3s ease,box-shadow .3s ease}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s ease}
.thumb:hover{transform:translateY(-4px);border-color:#555;box-shadow:0 12px 28px rgba(0,0,0,.24)}
.thumb:hover img{filter:brightness(.82)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.28));opacity:0;transition:opacity .25s ease;pointer-events:none}
.thumb:hover::after{opacity:1}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px;background:repeating-linear-gradient(45deg,#141414,#141414 12px,#1a1a1a 12px,#1a1a1a 24px)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:54px 16px 15px;background:linear-gradient(transparent,rgba(0,0,0,.82));font-size:14px;text-align:left;z-index:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .22s ease,transform .28s cubic-bezier(.22,1,.36,1)}.thumb:hover .cap,.thumb:focus-visible .cap{opacity:1;transform:translateY(0)}.cap-channel{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8c8c8;font-size:13px;font-weight:500;line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,.9);opacity:0;transform:translateY(5px);transition:opacity .2s ease .03s,transform .24s ease .03s}.cap-title{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font-size:17px;font-weight:700;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.95);opacity:0;transform:translateY(7px);transition:opacity .22s ease .06s,transform .28s cubic-bezier(.22,1,.36,1) .06s}.thumb:hover .cap-channel,.thumb:focus-visible .cap-channel,.thumb:hover .cap-title,.thumb:focus-visible .cap-title{opacity:1;transform:translateY(0)}.cap-views{position:absolute;top:10px;right:10px;flex:0 0 auto;color:#f3f3f3;background:rgba(8,8,8,.62);box-shadow:0 4px 14px rgba(0,0,0,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 10px;font-size:13px;font-weight:600;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;opacity:0;transform:translateY(-5px);transition:opacity .2s ease,transform .24s ease}.thumb:hover .cap-views,.thumb:focus-visible .cap-views{opacity:1;transform:translateY(0)}.cap-views::before{content:"";width:13px;height:8px;border:1.5px solid currentColor;border-radius:10px/7px;display:inline-block;opacity:.95;background:radial-gradient(circle at center,currentColor 0 2px,transparent 2.5px)}.practice-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);z-index:20;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}.practice-toast.show{opacity:1;transform:translate(-50%,0)}
.clients{display:flex;flex-wrap:wrap;gap:52px 64px;justify-content:center;text-align:center}
#clients h2,#clients .sub{text-align:center;margin-left:auto;margin-right:auto}
#clients .sub{max-width:60ch}
.client{contain:layout paint;display:flex;flex-direction:column;align-items:center;gap:14px;width:190px;text-align:center;color:var(--mute);transition:color .35s ease}
.client strong{font-weight:600;font-size:21px}
.client small{color:var(--mute);opacity:.78;font-size:15px;margin-top:-7px;transition:color .25s ease,opacity .25s ease}
.avatar{width:140px;height:140px;border-radius:50%;background:var(--panel);border:2px solid var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:30px;color:var(--gray);transition:filter .7s ease,border-color .7s ease,box-shadow .7s ease}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.client:hover{color:var(--hi)}
.client:hover .avatar{filter:brightness(1.08);border-color:#ff3b3b;border-width:1px;box-shadow:0 10px 20px rgba(185,28,28,.58),0 5px 9px rgba(185,28,28,.34)}
.client:hover small{color:#ff3b3b;opacity:1;text-shadow:0 0 8px rgba(185,28,28,.24)}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.socials{display:flex;align-items:center;gap:22px}
.socials a{display:inline-block;color:var(--mute);font-size:14px;font-weight:600;text-decoration:none;position:relative;transition:color .35s ease,transform .35s cubic-bezier(.22,1,.36,1)}
.socials a::after{content:"";position:absolute;left:0;bottom:-4px;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:center;transition:transform .35s cubic-bezier(.22,1,.36,1);opacity:.8}
.socials a:hover{color:var(--hi);transform:translateY(-2px)}
.socials a:hover::after{transform:scaleX(1)}
.socials svg{display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;z-index:10;padding:52px 24px 34px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility 0s linear .18s}
#lb.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .18s ease}
#lb .lb-content{display:flex;flex-direction:column;align-items:center;max-width:min(82vw,1160px);width:100%;gap:16px}
#lb img{display:block;width:auto;max-width:100%;max-height:78vh;border-radius:6px;transform:scale(.985);opacity:0;transition:transform .18s ease,opacity .18s ease;box-shadow:0 18px 55px rgba(0,0,0,.35)}#lb.open img{transform:scale(1);opacity:1}
#lb .lb-info{width:100%;display:flex;align-items:center;justify-content:space-between;gap:28px;text-align:left;padding:0 2px;box-sizing:border-box}
#lb .lb-meta{min-width:0;min-height:58px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:flex-start}
#lb .lb-channel{color:#a9a9a9;font-size:13px;font-weight:700;line-height:1.2;letter-spacing:.08em;text-transform:uppercase}
#lb .lb-title{color:#fff;font-size:18px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#lb .lb-views{color:#bdbdbd;font-size:13px;line-height:1.2;min-height:16px}#lb .lb-views[hidden]{display:block;visibility:hidden}
#lb .lb-youtube{position:relative;inset:auto;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:10px 17px;border-radius:12px;background:linear-gradient(180deg,#4a4a4a 0%,#2f2f2f 48%,#252525 100%);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:14px;font-weight:700;line-height:1;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 18px rgba(0,0,0,.22);gap:8px}
#lb .lb-youtube:hover{transform:translateY(-1px);background:linear-gradient(180deg,#555 0%,#363636 48%,#2b2b2b 100%);border-color:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 22px rgba(0,0,0,.3)}
#lb .lb-youtube svg{width:16px;height:16px;fill:currentColor;display:block}
#lb .lb-youtube[hidden]{display:none !important}
#lb button{position:absolute;background:none;border:0;color:#fff;cursor:pointer}
#lb .lb-x{top:12px;right:20px;font-size:36px}
#lb .lb-nav{top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.1);font-size:28px;font-weight:400;line-height:1;padding:0;text-align:center;display:flex;align-items:center;justify-content:center;transition:background-color .25s ease,transform .18s ease;box-sizing:border-box}
#lb .lb-nav:hover{background:rgba(255,255,255,.22)}
#lb .prev{left:max(18px,calc(50% - min(41vw,590px) - 54px))}#lb .next{right:max(18px,calc(50% - min(41vw,590px) - 54px))}
@media(max-width:760px){#lb{padding:50px 14px 24px}#lb .lb-content{max-width:92vw}#lb img{max-height:68vh}#lb .lb-info{align-items:flex-start;flex-direction:column}.lb-youtube{align-self:flex-start}#lb .prev{left:10px}#lb .next{right:10px}}
@keyframes seboEnter{0%{opacity:0;transform:translateY(34px)}65%{opacity:1;transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}
.enter{opacity:0;animation:seboEnter .78s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--delay,0ms);will-change:transform,opacity}
.page-loading body{opacity:0}
body{transition:background-color .5s,color .5s,opacity .35s ease}
.hero-name{position:relative;display:block;width:max-content;max-width:100%;flex:0 0 auto}
.hero-curve{position:relative;display:block;left:auto;right:auto;bottom:auto;width:100%;max-width:none;height:30px;margin:10px 0 0 0;overflow:visible;pointer-events:none}
.hero-curve path{fill:none;stroke:var(--gray);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:430;stroke-dashoffset:430;animation:drawCurve 1.05s cubic-bezier(.65,0,.35,1) 420ms forwards}
@keyframes drawCurve{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.enter{opacity:1;animation:none}.thumb,.thumb img,#lb,#lb img{transition:none}}
@media(max-width:900px){nav{display:none}header{grid-template-columns:1fr auto}.hero{padding:135px 24px 95px}.hero-top{flex-direction:column;row-gap:80px}.stat{width:100%;max-width:350px;justify-self:center}.grid{grid-template-columns:1fr}.avatar{width:108px;height:108px}.client{width:140px}.hero-curve{width:100%}.tool:not(:last-child)::after{display:none}}
.theme-anim,.theme-anim *,.theme-anim *::before,.theme-anim *::after{transition:background-color .7s ease,color .7s ease,border-color .7s ease,fill .7s ease,stroke .7s ease,filter .7s ease,box-shadow .7s ease!important}
:root.theme-anim #theme svg{transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .5s ease,stroke .7s ease!important}

/* Responsive compatibility layer — preserves the existing desktop design. */
html{overflow-x:hidden;scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{min-width:0;overflow-x:hidden;overscroll-behavior-x:none;}
img,svg{max-width:100%;}
button,input,textarea,select{font:inherit;}
.wrap{width:100%;}

@media (max-width:1200px){
  .wrap{max-width:1120px;padding-left:clamp(18px,3vw,24px);padding-right:clamp(18px,3vw,24px)}
  #work .wrap{max-width:1360px}
  .hero-top{gap:clamp(80px,10vw,180px)}

}

@media (max-width:900px){

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const THUMB_EXTS = [".jpg", ".jpeg", ".png", ".webp", ".avif"];

function loadThumb(img, base, index = 0) {
  if (!base) return;
  if (/^https?:\/\//i.test(base) || /\.(?:jpe?g|png|webp|avif)(?:[?#].*)?$/i.test(base)) {
    img.src = base;
    return;
  }
  if (index >= THUMB_EXTS.length) {
    img.style.display = "none";
    const ph = img.parentElement?.querySelector(".ph");
    if (ph) ph.style.display = "grid";
    return;
  }
  img.onerror = () => loadThumb(img, base, index + 1);
  img.src = base + THUMB_EXTS[index];
}

document.title = SITE.name + " · Thumbnails";
$("headline").textContent = SITE.name;
$("tagline").textContent = SITE.tagline;
function animateViews() {
  const el = $("statNum");
  const m = /^([\d.]+)\s*([KkMm]?)(\+)?/.exec(SITE.totalViews);
  const plus = /\+/.test(SITE.totalViews) ? "+" : "";
  const rawUnit = m ? m[2].toUpperCase() : "";
  const end = m ? parseFloat(m[1]) * ({ K: 1e3, M: 1e6 }[rawUnit] || 1) : 0;
  const start = Math.min(1e6, end);
  const dur = 2500;
  $("statSizer").textContent = SITE.totalViews;
  $("statLbl").textContent = "Total views";
  const f = v => {
    if (v >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M" + plus;
    if (v >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, "") + "K" + plus;
    return Math.round(v).toString() + plus;
  };
  // Keep the rendered number in a fixed, centered box so changing text can
  // never reflow the stat or flash/disappear between animation frames.
  el.textContent = f(start);
  if (end <= start) { el.textContent = SITE.totalViews; return; }
  let t0 = null;
  const tick = t => {
    if (t0 === null) t0 = t;
    const p = Math.min((t - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 4);
    el.textContent = p >= 1 ? SITE.totalViews : f(start + (end - start) * e);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

animateViews();
$("tools").innerHTML = SITE.tools.map(t => `<a class="tool" href="${esc(t.url)}" target="_blank" rel="noopener" aria-label="Download ${esc(t.name)}" title="${esc(t.name)}"><img src="${esc(t.img || TOOL_IMG[t.name] || "")}" alt=""><em>${esc(t.name)}</em></a>`).join("");
$("talk").href = SITE.talkUrl;
const tb = $("theme");
tb.addEventListener("click", () => {
  const r = document.documentElement;
  r.classList.add("theme-anim"); clearTimeout(window._ta); window._ta = setTimeout(() => r.classList.remove("theme-anim"), 1100);
  r.dataset.theme = r.dataset.theme === "light" ? "" : "light";
  try { localStorage.setItem("sebo-theme", r.dataset.theme === "light" ? "light" : "dark"); } catch (e) {}
  tb.classList.remove("spin"); void tb.offsetWidth; tb.classList.add("spin");
});
$("foot").textContent = "© 2026 " + SITE.name;

const shortTitle = title => {
  const words = String(title || "").trim().split(/\s+/);
  return words.length > 8 ? words.slice(0, 8).join(" ") + "..." : String(title || "");
};
const displayThumbTitle = t => t.practice ? "Practice thumbnail" : shortTitle(t.title);

$("grid").innerHTML = SITE.thumbnails.map((t, i) => `
  <button class="thumb" data-i="${i}" aria-label="Open ${esc(displayThumbTitle(t))}">
    ${t.img ? `<img data-thumb-base="${esc(t.img)}" alt="${esc(t.title)}" loading="lazy"><div class="ph" style="display:none">Add your thumbnail</div>` : `<div class="ph">Add your thumbnail</div>`}
    <div class="cap">${!t.practice ? `<span class="cap-channel" data-video-channel="${i}">${esc(t.client || "")}</span>` : ""}<span class="cap-title">${esc(displayThumbTitle(t))}</span></div>${t.youtubeUrl && !t.practice ? `<span class="cap-views" data-video-views="${i}">Loading...</span>` : ""}
  </button>`).join("");

[...document.querySelectorAll("img[data-thumb-base]")].forEach(img => loadThumb(img, img.dataset.thumbBase));

const videoId = url => {
  const m = String(url || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/i);
  return m ? m[1] : "";
};
const formatVideoViews = n => {
  n = Number(n);
  if (!Number.isFinite(n)) return "";
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "B views";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M views";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K views";
  return Math.round(n).toLocaleString() + " views";
};
async function loadVideoViews() {
  await Promise.all(SITE.thumbnails.map(async (t, i) => {
    if (!t.youtubeUrl || t.practice) return;
    const el = document.querySelector(`[data-video-views="${i}"]`);
    const channelEl = document.querySelector(`[data-video-channel="${i}"]`);
    try {
      const o = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(t.youtubeUrl)}&format=json`, { cache: "no-store" });
      if (o.ok) {
        const meta = await o.json();
        if (meta.title) {
          t.title = meta.title;
          const titleEl = document.querySelectorAll(".cap-title")[i];
          if (titleEl) titleEl.textContent = shortTitle(meta.title);
        }
        if (meta.author_name) {
          t.client = meta.author_name;
          if (channelEl) channelEl.textContent = meta.author_name;
        }
      }
    } catch (e) {}
    if (!el) return;
    try {
      const r = await fetch(`https://pulse.walls.sh/metrics?url=${encodeURIComponent(t.youtubeUrl)}`, { cache: "no-store" });
      if (!r.ok) throw new Error("metrics request failed");
      const d = await r.json();
      const count = typeof d.views === "number" ? d.views : (typeof d.views === "string" ? Number(d.views.replace(/[^0-9.]/g, "")) : NaN);
      if (Number.isFinite(count)) {
        t.views = count;
        el.textContent = formatVideoViews(count);
      }
    } catch (e) {
      if (el.textContent === "Loading...") el.textContent = "Views unavailable";
    }
  }));
}
loadVideoViews();
setInterval(loadVideoViews, 60000);

$("clientList").innerHTML = SITE.clients.map((c, i) => {
  const av = `<div class="avatar" data-av="${i}">${c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : esc(c.name[0] || "?")}</div>`;
  const inner = `${av}<strong>${esc(c.name)}</strong><small data-sub="${i}">${esc(c.subs || "")}</small>`;
  const link = c.link || (c.handle ? "https://youtube.com/" + c.handle : "");
  return link ? `<a class="client" href="${esc(link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="client">${inner}</div>`;
}).join("");

// Live subscriber counts + profile pictures, refreshed every minute.
// Uses the official YouTube Data API when a key is supplied; otherwise uses a
// public YouTube profile endpoint so this standalone HTML works without a key.
const fmt = n => { const f = (v, u) => (+v.toFixed(2)) + u; return (n >= 1e6 ? f(n / 1e6, "M") : n >= 1e3 ? f(n / 1e3, "K") : String(Math.round(n))) + " subscribers"; };
async function loadSubs() {
  await Promise.all(SITE.clients.map(async (c, i) => {
    if (!c.handle) return;
    try {
      let data = null;
      if (SITE.youtubeApiKey) {
        const r = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(c.handle)}&key=${SITE.youtubeApiKey}`, { cache: "no-store" });
        const it = ((await r.json()).items || [])[0];
        if (it) data = { followers: +it.statistics.subscriberCount, avatar: it.snippet?.thumbnails?.medium?.url || it.snippet?.thumbnails?.default?.url };
      } else {
        const channelUrl = c.link || `https://www.youtube.com/${c.handle}`;
        const r = await fetch(`https://pulse.walls.sh/profile?url=${encodeURIComponent(channelUrl)}`, { cache: "no-store" });
        const d = await r.json();
        if (d && typeof d.followers === "number") data = { followers: d.followers, avatar: d.avatar };
      }
      if (!data) return;
      const sub = document.querySelector(`[data-sub="${i}"]`);
      if (sub) sub.textContent = fmt(data.followers);
      const av = document.querySelector(`[data-av="${i}"]`);
      if (av && data.avatar && !av.querySelector("img")) av.innerHTML = `<img src="${esc(data.avatar)}" alt="">`;
    } catch (e) {}
  }));
}
loadSubs();
setInterval(loadSubs, 60000);
$("socials").innerHTML = SITE.socials.map(s =>
  `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.label)}" title="${esc(s.label)}">${esc(s.label)}</a>`).join("");

// Entry animation: the hero enters first in the requested order, then the rest follows.
const heroName = document.querySelector(".hero-name");
const heroHeadline = document.querySelector("#headline");
const heroCurve = document.querySelector(".hero-curve");
function syncHeroCurve(){
  if(!heroHeadline || !heroCurve) return;
  heroCurve.style.width = `${Math.ceil(heroHeadline.getBoundingClientRect().width)}px`;
}
requestAnimationFrame(syncHeroCurve);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeroCurve);
window.addEventListener("resize", syncHeroCurve, {passive:true});
const heroStat = document.querySelector(".stat");
const heroTools = document.querySelector(".tools");
const enterGroups = [
  [[heroName], 120],
  [[heroStat], 300],
  [[heroTools], 480],
  [[document.querySelector("header")], 620],
  [[...document.querySelectorAll(".tool")], 700],
  [[document.querySelector("#work h2"), document.querySelector("#work .sub")], 900],
  [[...document.querySelectorAll(".thumb")], 980],
  [[document.querySelector("#clients h2"), document.querySelector("#clients .sub")], 1180],
  [[...document.querySelectorAll(".client")], 1260],
  [[document.querySelector("footer")], 1450]
];
enterGroups.forEach(([els, delay]) => els.filter(Boolean).forEach((el, i) => {
  el.style.setProperty("--delay", `${delay + Math.min(i * 55, 330)}ms`);
  el.classList.add("enter");
}));
requestAnimationFrame(() => document.documentElement.classList.remove("page-loading"));

const lb = $("lb"), lbImg = lb.querySelector("img"), lbChannel = lb.querySelector(".lb-channel"), lbTitle = lb.querySelector(".lb-title"), lbViews = lb.querySelector(".lb-views"), lbYoutube = lb.querySelector(".lb-youtube");
let cur = -1;
const withImg = () => SITE.thumbnails.map((t, i) => t.img ? i : -1).filter(i => i >= 0);
function openAt(i) {
  cur = i;
  const t = SITE.thumbnails[i];
  lbImg.alt = t.title || "Thumbnail preview";
  lbChannel.textContent = t.practice ? "Practice thumbnail" : (t.client || "");
  lbTitle.textContent = t.practice ? "Practice thumbnail" : (t.title || "");
  lbViews.textContent = (!t.practice && typeof t.views === "number") ? formatVideoViews(t.views) : "";
  lbViews.hidden = t.practice || typeof t.views !== "number";
  lbYoutube.hidden = !t.youtubeUrl || t.practice;
  lbYoutube.dataset.url = t.youtubeUrl || "";
  if (t.img) loadThumb(lbImg, t.img);
  lb.classList.add("open");
}
function step(d) { const l = withImg(); if (l.length < 2) return; openAt(l[(l.indexOf(cur) + d + l.length) % l.length]); }
let practiceToastTimer;
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".thumb"); if (!b) return;
  const t = SITE.thumbnails[+b.dataset.i];
  if (t.img) openAt(+b.dataset.i);
});
lb.querySelector(".prev").addEventListener("click", () => step(-1));
lb.querySelector(".next").addEventListener("click", () => step(1));
lbYoutube.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();
  const url = lbYoutube.dataset.url || SITE.thumbnails[cur]?.youtubeUrl;
  if (!url) return;
  const tab = window.open("about:blank", "_blank");
  if (tab) {
    tab.opener = null;
    tab.location.href = url;
  }
});
lb.addEventListener("click", e => { if (!e.target.closest(".lb-nav") && !e.target.closest(".lb-youtube")) lb.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") lb.classList.remove("open");
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

// Let the browser handle scrolling natively. This avoids intercepting wheel events
// and running a requestAnimationFrame loop for every scroll gesture.
</script>

<script>
/* Thumbnail protection: block common casual copy/save interactions. */
function isProtectedImageTarget(target) {
  return !!(target && target.closest && (
    target.closest('.grid .thumb') ||
    target.closest('#lb')
  ));
}

document.addEventListener('contextmenu', function (e) {
  if (isProtectedImageTarget(e.target)) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
}, true);

document.addEventListener('dragstart', function (e) {
  if (isProtectedImageTarget(e.target)) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
}, true);

document.addEventListener('copy', function (e) {
  if (window.getSelection && window.getSelection().anchorNode) {
    const node = window.getSelection().anchorNode;
    const el = node.nodeType === 1 ? node : node.parentElement;
    if (el && el.closest && el.closest('.grid .thumb')) {
      e.preventDefault();
    }
  }
});
</script>


<script>
/* Smooth section navigation — prevent the instant anchor jump. */
document.addEventListener('click', function (e) {
  const link = e.target.closest('header nav a[href^="#"]');
  if (!link) return;

  const id = link.getAttribute('href');
  const target = document.querySelector(id);
  if (!target) return;

  e.preventDefault();
  e.stopPropagation();

  const header = document.querySelector('header');
  const offset = header ? header.getBoundingClientRect().height + 24 : 105;
  const top = target.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({
    top: top,
    behavior: 'smooth'
  });

  history.replaceState(null, '', id);
}, true);
</script>
